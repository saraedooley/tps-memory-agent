# Declarative Automation Bundle (DAB): infrastructure-as-code for the demo.
# Provisions an MLflow experiment and the Databricks App, and binds the
# resources the app's service principal needs (model endpoint, experiment, the
# three UC functions). Deploy with:  databricks bundle deploy -t dev
#
# Target workspace: fevm-digital-twin-generic.cloud.databricks.com (org 7474657725221208)

bundle:
  name: tps-memory-agent

# Keep the deployed app slim: ship only the runtime files (agent.py, server.py,
# chat.html, requirements.txt, app.yaml, config/). Everything else is dev tooling.
sync:
  exclude:
    - ".venv/**"
    - "**/__pycache__/**"
    - ".git/**"
    - "docs/**"
    - "setup/**"
    - "eval/**"
    - "scripts/**"
    - "sql/**"
    - ".databricks/**"

variables:
  catalog_name:
    description: UC catalog holding the tps schema, data, and functions.
    default: digital_twin_generic_catalog
  schema_name:
    default: tps
  lakebase_project:
    description: Lakebase Autoscaling project backing agent memory.
    default: tps-memory-agent
  lakebase_branch:
    default: production
  serving_endpoint:
    description: Foundation Models API serving endpoint for the LLM.
    default: databricks-claude-sonnet-4-6

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-digital-twin-generic.cloud.databricks.com

resources:
  apps:
    tps-memory-agent:
      name: tps-memory-agent
      description: Collaborative TPS authoring agent with short-term + long-term memory on Lakebase.
      source_code_path: .
      # Runtime command + env come from the source app.yaml (kept in sync there).
      resources:
        - name: serving-endpoint
          serving_endpoint:
            name: ${var.serving_endpoint}
            permission: CAN_QUERY
        - name: embedding-endpoint
          serving_endpoint:
            name: databricks-gte-large-en
            permission: CAN_QUERY
        - name: fn-recommend-test-limits
          uc_securable:
            securable_type: FUNCTION
            securable_full_name: ${var.catalog_name}.${var.schema_name}.recommend_test_limits
            permission: EXECUTE
        - name: fn-yield-risk-by-block
          uc_securable:
            securable_type: FUNCTION
            securable_full_name: ${var.catalog_name}.${var.schema_name}.yield_risk_by_block
            permission: EXECUTE
        - name: fn-lookup-equipment
          uc_securable:
            securable_type: FUNCTION
            securable_full_name: ${var.catalog_name}.${var.schema_name}.lookup_equipment_for_test
            permission: EXECUTE
