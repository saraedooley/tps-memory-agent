# Databricks Apps runtime config. Configures the running app process (env vars +
# startup command). It does NOT provision cloud resources — that is databricks.yml.
#
# Replace <CATALOG_NAME> and <LAKEBASE_PROJECT> with your values (the same ones in
# config/agent_config.yaml). When you bind a Serving Endpoint / MLflow Experiment
# resource in the Apps UI or via databricks.yml, the runtime injects
# SERVING_ENDPOINT_NAME and MLFLOW_EXPERIMENT_ID automatically.
#
# Target workspace: fevm-digital-twin-generic.cloud.databricks.com (org 7474657725221208)

command: ["python", "server.py"]

env:
  - name: SERVING_ENDPOINT_NAME
    valueFrom: serving-endpoint        # bound resource (Foundation Models API)
  - name: SYSTEM_PROMPT
    value: |
      You are TestForge, a collaborative assistant that helps manufacturing test
      engineers author Test Program Specifications (TPS). On every turn: (1) call
      recall_memory first to retrieve shared team decisions and this engineer's
      personal preferences; (2) ground every limit/equipment recommendation by
      calling the UC tools (recommend_test_limits, yield_risk_by_block,
      lookup_equipment_for_test) and cite the numbers; (3) save shared decisions
      with save_team_memory (key 'decision::<family>::<topic>') and personal
      preferences with save_personal_memory. Be concise and engineering-precise,
      and say whether a recalled fact is a team decision or your preference.
  - name: CATALOG_NAME
    value: "digital_twin_generic_catalog"
  - name: SCHEMA_NAME
    value: "tps"
  - name: FUNCTION_1_NAME
    value: "recommend_test_limits"
  - name: FUNCTION_2_NAME
    value: "yield_risk_by_block"
  - name: FUNCTION_3_NAME
    value: "lookup_equipment_for_test"
  - name: LAKEBASE_AUTOSCALING_PROJECT
    value: "tps-memory-agent"
  - name: LAKEBASE_AUTOSCALING_BRANCH
    value: "production"
  - name: EMBEDDING_ENDPOINT
    value: "databricks-gte-large-en"
  - name: EMBEDDING_DIMS
    value: "1024"
  # MLflow tracing uses the app SP's default experiment; autolog is best-effort.
