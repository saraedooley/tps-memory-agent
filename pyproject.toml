[project]
name = "tps-memory-agent"
version = "0.1.0"
description = "Collaborative Test Program Specification authoring agent with short-term and long-term memory on Databricks (Lakehouse + Lakebase + Apps + Foundation Models API)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-langchain[memory]",
    "databricks-sdk",
    "databricks-agents",
    "mlflow-skinny[databricks]",
    "unitycatalog-langchain[databricks]",
    "langchain",
    "langgraph",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
]

[project.scripts]
start-server = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This is a single-module app, not a package; ship the top-level modules.
include = ["agent.py", "server.py", "chat.html"]
